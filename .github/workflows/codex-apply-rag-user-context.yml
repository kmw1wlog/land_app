name: Apply Codex User Context RAG Patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/codex-apply-rag-user-context.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          curl -fsSL "https://paste.rs/HthAO" | base64 -d | gunzip > /tmp/homepath-rag-user-context.patch
          git apply --index /tmp/homepath-rag-user-context.patch
          git rm -f .github/workflows/codex-apply-rag-user-context.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Personalize RAG with user context anchors"
          git push

