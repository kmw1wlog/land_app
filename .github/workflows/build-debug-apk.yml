name: Apply HomePath Fusion Patch

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'Apply HomePath fusion patch bootstrap') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Apply compressed patch and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show HEAD:.github/homepath-fusion.patch.gz.b64 > /tmp/homepath-fusion.patch.gz.b64
          base64 -d /tmp/homepath-fusion.patch.gz.b64 > /tmp/homepath-fusion.patch.gz
          gzip -d /tmp/homepath-fusion.patch.gz
          git apply --index /tmp/homepath-fusion.patch
          git checkout HEAD^ -- .github/workflows/build-debug-apk.yml
          git rm -f .github/homepath-fusion.patch.gz.b64
          git status --short
          git commit -m "Add fusion public data evidence and RAG context"
          git push origin HEAD:main
